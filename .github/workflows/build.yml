name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: >
          dotnet publish PropertyEditor/PropertyEditor.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:AssemblyName=SimpleJavaPropertyEditor

      - uses: actions/upload-artifact@v4
        with:
          name: SimpleJavaPropertyEditor
          path: publish/SimpleJavaPropertyEditor.exe
